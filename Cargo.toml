[workspace]
members = ["macros"]

[package]
name = "evergreen_relations"
version = "0.3.0"
edition = "2024"
description = "A library for defining relationships in Bevy ECS, including many-to-many."
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/evergreen_relations"
homepage = "https://github.com/EvergreenNest/evergreen_relations"
repository = "https://github.com/EvergreenNest/evergreen_relations"

[dependencies]
evergreen_relations_macros = { version = "0.1.0", path = "macros" }
bevy_ecs = { version = "0.18", default-features = false }
smallvec = { version = "1.13", features = ["const_generics"] }